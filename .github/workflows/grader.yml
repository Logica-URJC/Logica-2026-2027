name: Evaluacion Practica Ciao-Prolog

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    container:
      image: ciaolang/ciao:latest

    steps:
      - name: Descargar codigo del alumno
        uses: actions/checkout@v4

      - name: Ejecutar batería de pruebas
        run: |
          ciao main -f evaluador.pl > resultado.txt 2>&1 || true
          cat resultado.txt

      - name: Publicar feedback en la ejecucion de GitHub
        run: |
          echo "## Resultado de la Evaluación" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat resultado.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
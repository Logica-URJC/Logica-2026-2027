name: Evaluacion Practica Ciao-Prolog

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del alumno
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Descargar e invocar Ciao
        run: |
          docker pull ciaolang/ciao
          
          # 1. Compilar evaluador.pl a un ejecutable llamado 'eval'
          docker run --rm -v $PWD:/code -w /code ciaolang/ciao /ciao/build/bin/ciaoc -o eval evaluador.pl
          
          # 2. Dar permisos y ejecutar el binario generado
          docker run --rm -v $PWD:/code -w /code ciaolang/ciao sh -c "chmod +x ./eval && ./eval > resultado.txt 2>&1 || true"
          
          cat resultado.txt
      - name: Extraer alumno y nota para GitHub Classroom
        id: student
        run: |
          # Extrae el nombre tras 'Alumno ='
          STUDENT_NAME=$(grep -oP 'Alumno\s*=\s*\K.*' resultado.txt | head -n 1 | xargs)

          # Extrae la nota tras 'Nota Practica ='
          SCORE=$(grep -oP 'Nota Practica\s*=\s*\K\d+' resultado.txt | head -n 1)

          # Valores por defecto si no se encuentran
          STUDENT_NAME=${STUDENT_NAME:-"Desconocido"}
          SCORE=${SCORE:-0}

          echo "STUDENT_NAME=$STUDENT_NAME" >> $GITHUB_ENV
          echo "SCORE_VAL=$SCORE" >> $GITHUB_ENV


      - name: Publicar feedback en el Step Summary
        run: |
          echo "## Resultado de la Evaluacion" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat resultado.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

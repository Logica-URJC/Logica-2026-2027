name: Evaluacion

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout solución alumno
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ciao Prolog y ejecución
        run: |
          docker pull ciaolang/ciao

          # Compilar el evaluador
          docker run --rm \
            -v "$PWD:/code" \
            -w /code \
            ciaolang/ciao \
            /ciao/build/bin/ciaoc -o eval evaluador.pl

          # Ejecutar el evaluador
          docker run --rm \
            -v "$PWD:/code" \
            -w /code \
            ciaolang/ciao \
            sh -c "chmod +x ./eval && ./eval > resultado.txt 2>&1 || true"

      - name: Evaluar
        run: |
          cat resultado.txt
          cat resultado.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Reportar resultados
        run: |
          STUDENT_NAME=$(grep -oP 'Alumno\s*=\s*\K.*' resultado.txt | head -n 1 | xargs)
          STUDENT_EMAIL=$(grep -oP 'Correo electrónico\s*=\s*\K.*' resultado.txt | head -n 1 | xargs)
          STUDENT_DEGREE=$(grep -oP 'Grado\s*=\s*\K.*' resultado.txt | head -n 1 | xargs)
          SCORE=$(grep -oP 'Nota Practica\s*=\s*\K\d+' resultado.txt | head -n 1)

          # Valores por defecto
          STUDENT_NAME=${STUDENT_NAME:-"Desconocido"}
          STUDENT_EMAIL=${STUDENT_EMAIL:-"Sin email"}
          STUDENT_DEGREE=${STUDENT_DEGREE:-"Sin grado"}
          SCORE=${SCORE:-0}

          # Guardar para los siguientes steps
          echo "STUDENT_NAME=$STUDENT_NAME" >> "$GITHUB_ENV"
          echo "STUDENT_EMAIL=$STUDENT_EMAIL" >> "$GITHUB_ENV"
          echo "STUDENT_DEGREE=$STUDENT_DEGREE" >> "$GITHUB_ENV"
          echo "SCORE_VAL=$SCORE" >> "$GITHUB_ENV"

          # Generar CSV
          echo "Fecha,Usuario_GitHub,Nombre_Alumno,Correo,Grado,Nota" \
            > resultado_evaluacion.csv

          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ'),${{ github.actor }},\"$STUDENT_NAME\",\"$STUDENT_EMAIL\",\"$STUDENT_DEGREE\",$SCORE" \
            >> resultado_evaluacion.csv

          # Enviar resultado
          jq -n \
            --arg user "${{ github.actor }}" \
            --arg alumno "$STUDENT_NAME" \
            --arg correo "$STUDENT_EMAIL" \
            --arg grado "$STUDENT_DEGREE" \
            --argjson nota "$SCORE" \
            '{
              user: $user,
              alumno: $alumno,
              correo: $correo,
              grado: $grado,
              nota: $nota
            }' > payload.json

          curl -L \
            -X POST "https://script.google.com/macros/s/AKfycby51E8fyXRoZWKUTlrRrmDb6IJX7Sso5nmb5NU1I33kc27RVpaT0HjsDOs3pXjqmLuf/exec" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json

      - name: Resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            resultado.txt
            resultado_evaluacion.csv
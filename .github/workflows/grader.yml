name: Evaluacion Practica Ciao-Prolog

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del alumno
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Descarga todo el historial para evitar arboles corruptos o incompletos
          clean: true         # Limpia el espacio de trabajo antes de hacer checkout
	

      - name: Ejecutar batería de pruebas en Ciao-Prolog
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/code \
            -w /code \
            ciaolang/ciao:latest \
            sh -c "ciao main -f evaluador.pl > resultado.txt 2>&1 || true"
          
          cat resultado.txt

      - name: Publicar feedback en la ejecucion de GitHub
        run: |
          echo "## Resultado de la Evaluación" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat resultado.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY